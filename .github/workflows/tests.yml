name: Testes da API

# Roda automaticamente a cada push ou Pull Request na branch main
on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  testar-backend:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # 2. Configura o Python no servidor do GitHub
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Instala as bibliotecas do backend
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 4. Cria o arquivo .env e popula o banco SQLite com os dados extraídos
      - name: Preparar banco de dados de teste
        run: |
          cp .env.example .env
          python backend/scripts/popularBanco.py

      # 5. Executa os testes automatizados com pytest
      - name: Rodar testes com Pytest
        run: pytest backend/tests/test_api.py -v

